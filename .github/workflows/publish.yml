name: Publish Bangumi dump

on:
  schedule:
    # Wednesday 21:00 in UTC+8 = Wednesday 13:00 UTC.
    - cron: '0 13 * * 3'
  workflow_dispatch:
    inputs:
      since:
        description: 'Optional earlier air-date cutoff (YYYY-MM-DD); cannot narrow the automatic window'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-bangumi-dump
  cancel-in-progress: false

jobs:
  publish:
    # Only publish from the default branch, including manual runs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [ -n "$INPUT_SINCE" ]; then
            args+=(--since "$INPUT_SINCE")
          fi
          python scripts/publish_dump.py "${args[@]}"

      - name: Commit published manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if git diff --cached --quiet; then
            echo 'Published manifest is already up to date.'
            exit 0
          fi
          git commit -m 'data: record published Bangumi dump'
          git push origin HEAD

      - name: Summarize
        run: |
          echo '### Published Bangumi dump' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data/latest.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
